name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/urbangate

      - name: Build packages
        run: pnpm --filter @urbangate/config --filter @urbangate/types --filter @urbangate/database build
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/urbangate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/urbangate
          SESSION_SECRET: ci-session-secret-min-16
